<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada · Camilo Prado</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#17182b">
  <!-- GitHub sirve esta página desde cualquier dirección. Este script fija la base de las rutas:
       "/" con dominio propio o en local, y "/<repo>/" en usuario.github.io/<repo>.
       Así las rutas relativas de abajo funcionan en los dos casos sin tocar nada. -->
  <script>
    (function () {
      var base = document.createElement('base');
      var repo = location.pathname.split('/')[1];
      base.href = location.hostname.endsWith('.github.io') && repo ? '/' + repo + '/' : '/';
      document.head.appendChild(base);
    })();
  </script>
  <link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:ital,wght@0,400..900;1,700..900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap">
  <link rel="stylesheet" href="css/main.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <main id="contenido">
    <section class="section notfound" aria-labelledby="nf-titulo">
      <div class="container container--narrow section__inner">
        <img class="sello" src="assets/logo/sello-principal.svg" alt="" width="72" height="72">
        <h1 id="nf-titulo" class="section__title">Esta página no existe.</h1>
        <p class="section__intro">Puede que el enlace haya cambiado. El programa y los encuentros están en la portada.</p>
        <p><a class="btn btn--primario" href="./">Ir a la portada</a></p>
      </div>
    </section>
  </main>

  <!-- Pie compartido (incluye el aviso de comunicación no institucional) -->
  <div data-include="partials/footer.html"></div>
</body>
</html>
