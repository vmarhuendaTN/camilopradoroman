<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web en construcción</title>
  <meta name="description" content="Web en construcción.">
  <!-- Modo «en construcción»: que los buscadores no indexen nada mientras tanto -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#fbf7f1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400..900&display=swap">
  <link rel="stylesheet" href="css/settings/tokens.css">
  <!-- Página temporal: la web completa está guardada en la rama copia-web-completa-2026-10-15 -->
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      background: var(--color-papel);
      color: var(--color-tinta);
      font-family: var(--font-titular);
      -webkit-font-smoothing: antialiased;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-5);
      padding: var(--space-8) var(--gutter);
      text-align: center;
    }
    h1 {
      margin: 0;
      font-size: var(--fs-h2);
      font-weight: var(--fw-bold);
      letter-spacing: var(--tracking-display);
      line-height: var(--lh-display);
    }
    .texto { margin: 0; font-size: var(--fs-body); color: var(--color-pizarra); }
  </style>
</head>
<body>
  <main>
    <h1>Web en construcción.</h1>
    <p class="texto">Muy pronto, toda la información en esta dirección.</p>
  </main>
</body>
</html>
